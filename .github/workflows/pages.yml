name: Docs site

# Publishes site/ to GitHub Pages whenever it, or the library it runs, changes on main.
# The page is static HTML; the only build step compiles src/ so the playground and the
# streaming demo run the library exactly as it is on main.
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'package.json', 'package-lock.json', 'tsconfig.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write    # to deploy to Pages
      id-token: write # to verify the deployment comes from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, package-manager-cache: false }
      # --ignore-scripts: no dependency runs code in a job that can deploy.
      - run: npm ci --ignore-scripts
      - name: Build the library into site/lib
        run: |
          npm run build
          mkdir -p site/lib
          cp dist/*.js site/lib/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
